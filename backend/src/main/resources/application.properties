# ==========================================================
# StudyBoard Backend Configuration
# ALL secrets/config come from environment variables.
# Render injects these from the dashboard / render.yaml.
# Never hardcode credentials here.
# ==========================================================

spring.application.name=studyboard-backend

# Render dynamically assigns the port via $PORT. Default to 8080 for local dev.
server.port=${PORT:8080}

# ----- Database (external managed MySQL: Railway / Aiven / etc.) -----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Managed MySQL providers often require SSL and idle-connection handling
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000

# ----- CORS -----
# Set to the deployed Render static site URL, e.g. https://studyboard-frontend.onrender.com
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ----- JWT -----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ----- Cloudinary (PDF / file storage) -----
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ----- AI summarization -----
ai.api.key=${AI_API_KEY:}
ai.api.url=${AI_API_URL:https://api.groq.com/openai/v1/chat/completions}
ai.api.model=${AI_API_MODEL:openai/gpt-oss-20b}

# ----- Actuator health check (used by Render health checks) -----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Multipart limits for notes upload -> PDF export flows
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.studyboard=INFO
