services:
  # ---------------------------------------------------------------
  # Backend: Spring Boot, containerized via Dockerfile
  # ---------------------------------------------------------------
  - type: web
    name: studyboard-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # ---- Database: external managed MySQL (Railway / Aiven / etc.) ----
      # Set these manually in the Render dashboard after provisioning your
      # MySQL instance — Render has no native MySQL, only Postgres/Redis.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      # ---- CORS: set to the deployed frontend URL once known ----
      - key: FRONTEND_URL
        sync: false

      # ---- JWT ----
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"

      # ---- Cloudinary (PDF/file storage) ----
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ---- AI summarization ----
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://api.anthropic.com/v1/messages
      - key: AI_API_MODEL
        value: claude-sonnet-4-6

      # ---- Schema management ----
      # "update" auto-creates/updates tables on boot. Switch to "validate"
      # once your schema has stabilized in production.
      - key: DDL_AUTO
        value: update

  # ---------------------------------------------------------------
  # Frontend: React + Vite, deployed as a Render Static Site
  # ---------------------------------------------------------------
  - type: web
    name: studyboard-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      # SPA fallback so client-side routes (e.g. /room/123) don't 404 on refresh
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to the backend's Render URL once the backend service is live,
      # e.g. https://studyboard-backend.onrender.com
      - key: VITE_API_URL
        sync: false
